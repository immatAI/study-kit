name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall scripts
      - name: CLI help
        run: |
          python scripts/receipt.py --help >/dev/null
          python scripts/dedupe.py --help >/dev/null
